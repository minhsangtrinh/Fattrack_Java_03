services:
  redis-primary:
    image: redis:7.4-alpine
    command:
      - redis-server
      - --bind
      - 0.0.0.0
      - --protected-mode
      - "no"
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - primary-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15

  redis-replica:
    image: redis:7.4-alpine
    command:
      - redis-server
      - --bind
      - 0.0.0.0
      - --protected-mode
      - "no"
      - --replicaof
      - redis-primary
      - "6379"
      - --replica-read-only
      - "yes"
      - --replica-serve-stale-data
      - "no"
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
    ports:
      - "127.0.0.1:6380:6379"
    depends_on:
      redis-primary:
        condition: service_healthy
    volumes:
      - replica-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli INFO replication | grep -q 'master_link_status:up'"]
      interval: 2s
      timeout: 2s
      retries: 30

volumes:
  primary-data:
  replica-data:
